<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mancala Game - Enhanced Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<body>
    <div class="game-info">
        <div class="computer-label">Computer</div>
        <div class="player-label">Player</div>
    </div>

    <div class="mancala-board" id="mancalaBoard" role="main" aria-label="Mancala game board">
    </div>

    <div id="turnIndicator" class="turn-indicator" role="status" aria-live="polite">Player's Turn</div>
    <div id="statusMessage" class="status-message" role="status" aria-live="polite">Click one of your pits to start.</div>
    <button id="newGameButton" aria-label="Start a new game">New Game</button>

    <script type="module" src="js/main.js"></script>
</body>
</html>
